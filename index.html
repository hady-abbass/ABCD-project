<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>مدرب ABCDE للفرز الطارئ</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* ثيم فاتح افتراضي + Dark Mode أسود صريح (#000000) */
    body.dark, body[data-theme="dark"], html.dark body {
      background-color: #000000 !important;
      color: #F9FAFB !important;
    }
    body.dark .card, body[data-theme="dark"] .card,
    body.dark .visual-scenario-card, body[data-theme="dark"] .visual-scenario-card,
    body.dark .visual-guide-panel, body[data-theme="dark"] .visual-guide-panel {
      background-color: #09090B !important;
      border-color: #27272A !important;
      color: #F9FAFB !important;
    }

    /* شريط البطاقات المصورة التفاعلية */
    .visual-hero-wrapper {
      margin: 14px 0 22px;
    }
    .visual-hero-label {
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 10px;
      color: #2563EB;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    body.dark .visual-hero-label, body[data-theme="dark"] .visual-hero-label {
      color: #60A5FA;
    }
    .visual-hero-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
      gap: 12px;
    }
    .visual-scenario-card {
      background: #FFFFFF;
      border: 1.5px solid #E2E8F0;
      border-radius: 16px;
      padding: 12px 10px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .visual-scenario-card:hover, .visual-scenario-card.active {
      transform: translateY(-3px);
      border-color: #2563EB;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.14);
    }
    .visual-scenario-card svg {
      width: 100%;
      max-width: 140px;
      height: 82px;
      border-radius: 10px;
    }
    .visual-scenario-title {
      font-weight: 700;
      font-size: 0.92rem;
      line-height: 1.3;
    }
    .visual-scenario-sub {
      font-size: 0.76rem;
      opacity: 0.78;
      line-height: 1.3;
    }

    /* لوحة الدليل المصور الشامل تحت الكروت */
    .visual-guide-panel {
      display: none;
      margin: 22px 0;
      padding: 20px;
      border-radius: 18px;
      background: linear-gradient(145deg, #F8FAFC 0%, #EFF6FF 100%);
      border: 1.5px solid #93C5FD;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.08);
      animation: fadeSlideIn 0.25s ease;
    }
    body.dark .visual-guide-panel, body[data-theme="dark"] .visual-guide-panel {
      background: #09090B !important;
      border-color: #2563EB !important;
    }
    .visual-guide-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 14px;
    }
    .visual-guide-badge {
      display: inline-block;
      background: #2563EB;
      color: #FFFFFF;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 999px;
    }
    .visual-guide-panel h3 {
      margin: 0;
      font-size: 1.12rem;
      color: #1E3A8A;
    }
    body.dark .visual-guide-panel h3, body[data-theme="dark"] .visual-guide-panel h3 {
      color: #93C5FD;
    }
    .visual-guide-art {
      max-width: 520px;
      margin: 0 auto 14px;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(37, 99, 235, 0.2);
    }
    .visual-guide-art svg {
      width: 100%;
      height: auto;
      display: block;
    }
    .visual-guide-steps {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 10px;
      margin-top: 12px;
      text-align: start;
    }
    .vg-step-box {
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid #DBEAFE;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 0.86rem;
      line-height: 1.55;
    }
    body.dark .vg-step-box, body[data-theme="dark"] .vg-step-box {
      background: #121215;
      border-color: #27272A;
    }
    .vg-step-box strong {
      display: block;
      color: #2563EB;
      margin-bottom: 3px;
      font-size: 0.88rem;
    }
    body.dark .vg-step-box strong, body[data-theme="dark"] .vg-step-box strong {
      color: #60A5FA;
    }
    .vg-special-note {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 10px;
      background: rgba(124, 58, 237, 0.08);
      border-inline-start: 4px solid #7C3AED;
      font-size: 0.85rem;
      line-height: 1.6;
      text-align: start;
    }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

          ],

      let activeScenarioId = null;

      function isEnglishUI() {
        return document.documentElement.lang === "en" || document.documentElement.dir === "ltr";
      }

      function renderVisualEnhancements() {
        const app = document.getElementById("app");
        if (!app) return;
        const en = isEnglishUI();

        // 1. حقن بطاقات الحالات السريعة المصورة في أعلى الصفحة
        let wrapper = document.getElementById("visual-hero-wrapper");
        if (!wrapper) {
          wrapper = document.createElement("section");
          wrapper.id = "visual-hero-wrapper";
          wrapper.className = "visual-hero-wrapper";
          app.prepend(wrapper);
        }

        wrapper.innerHTML = `
          <div class="visual-hero-label">
            <span>🩺</span>
            <span>${en ? "Quick Visual Emergency Scenarios (Click to load & view diagram):" : "اختر حالة طارئة سريعة (لعرض الرسم التوضيحي والتحليل الفوري):"}</span>
          </div>
          <div class="visual-hero-strip">
            ${SCENARIOS_DATA.map(s => `
              <button type="button" class="visual-scenario-card ${activeScenarioId === s.id ? "active" : ""}" data-scenario-id="${s.id}">
                ${SVG_ART[s.id]}
                <div class="visual-scenario-title">${en ? s.titleEn : s.titleAr}</div>
                <div class="visual-scenario-sub">${en ? s.subEn : s.subAr}</div>
              </button>
            `).join("")}
          </div>
        `;

        // 2. حقن لوحة الدليل المصور أسفل الكروت لسهولة المسح البصري
        let panel = document.getElementById("visual-guide-panel");
        if (!panel) {
          panel = document.createElement("section");
          panel.id = "visual-guide-panel";
          panel.className = "visual-guide-panel";
          app.appendChild(panel);
        }

        if (activeScenarioId) {
          updatePanelContent(activeScenarioId);
        }
      }

      function updatePanelContent(scenarioId) {
        const panel = document.getElementById("visual-guide-panel");
        const item = SCENARIOS_DATA.find(s => s.id === scenarioId);
        if (!panel || !item) return;

        const en = isEnglishUI();
        const steps = en ? item.stepsEn : item.stepsAr;

        panel.innerHTML = `
          <div class="visual-guide-header">
            <h3>${en ? item.guideTitleEn : item.guideTitleAr}</h3>
            <span class="visual-guide-badge">${en ? "Step-by-Step Illustrated Guide" : "دليل مصور مشروح بالخطوات"}</span>
          </div>
          <div class="visual-guide-art">${SVG_ART[item.id]}</div>
          <div class="visual-guide-steps">
            ${steps.map(st => `
              <div class="vg-step-box">
                <strong>${st.title}</strong>
                <span>${st.text}</span>
              </div>
            `).join("")}
          </div>
          <div class="vg-special-note">
            ${en ? item.specialEn : item.specialAr}
          </div>
        `;
        panel.style.display = "block";
      }

      function detectAndShowGuide(text) {
        const lower = (text || "").toLowerCase();
        const match = SCENARIOS_DATA.find(s => s.keys.some(k => lower.includes(k)));
        const panel = document.getElementById("visual-guide-panel");
        if (!match) {
          activeScenarioId = null;
          if (panel) panel.style.display = "none";
          return;
        }
        activeScenarioId = match.id;
        document.querySelectorAll(".visual-scenario-card").forEach(c => {
          c.classList.toggle("active", c.dataset.scenarioId === match.id);
        });
        updatePanelContent(match.id);
      }

      // التفاعل عند الضغط على البطاقات السريعة
      document.addEventListener("click", (e) => {
        const cardBtn = e.target.closest(".visual-scenario-card");
        if (cardBtn) {
          const item = SCENARIOS_DATA.find(x => x.id === cardBtn.dataset.scenarioId);
          if (!item) return;
          const en = isEnglishUI();
          const promptText = en ? item.promptEn : item.promptAr;
          const app = document.getElementById("app");
          const input = app ? app.querySelector("textarea, input[type='text']") : null;
          if (input) {
            input.value = promptText;
            input.dispatchEvent(new Event("input", { bubbles: true }));
            input.focus();
          }
          detectAndShowGuide(promptText);
          return;
        }

        // تحديث الرسم عند الضغط على أي زر تحليل أو تغيير اللغة
        if (e.target && e.target.closest("#app button")) {
          const input = document.querySelector("#app textarea, #app input[type='text']");
          if (input && input.value.trim()) detectAndShowGuide(input.value);
        }
        if (e.target && e.target.closest("#lang-toggle")) {
          setTimeout(renderVisualEnhancements, 60);
        }
      });

      // تحديث فوري أثناء الكتابة
      document.addEventListener("input", (e) => {
        if (e.target && e.target.matches("#app textarea, #app input[type='text']")) {
          detectAndShowGuide(e.target.value);
        }
      });

      // مراقبة تغيرات DOM أو اللغة لإعادة رسم العناصر البصرية بسلاسة
      const appNode = document.getElementById("app");
      if (appNode) {
        const observer = new MutationObserver(() => {
          if (!document.getElementById("visual-hero-wrapper") || !document.getElementById("visual-guide-panel")) {
            renderVisualEnhancements();
          }
        });
        observer.observe(appNode, { childList: true });
      }

      const langObserver = new MutationObserver(() => renderVisualEnhancements());
      langObserver.observe(document.documentElement, { attributes: true, attributeFilter: ["lang", "dir"] });

      window.addEventListener("DOMContentLoaded", renderVisualEnhancements);
      setTimeout(renderVisualEnhancements, 150);
    })();
  </script>
